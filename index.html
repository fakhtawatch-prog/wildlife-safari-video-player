<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wildlife Safari</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<header><div><h1>Wildlife Safari</h1><p>Watch what happened around the nest.</p></div><button id="fullscreenBtn">Fullscreen</button></header>
<main>
<section class="summary" id="summary"><strong id="summaryText">Loading recording statistics…</strong></section>
<section class="daybar"><label for="dateSelect">Date</label><select id="dateSelect"></select><span id="dayStats"></span></section>
<section class="player"><video id="video" controls preload="metadata" playsinline></video><div id="videoStatus"></div></section>
<section class="clip-description"><h2>Description</h2><p id="clipDescription">Select a recording to see its description.</p></section>
<section class="controls"><button id="activityBtn">Zoom to Activity</button><button id="timelineBtn">Hide Timeline</button><button id="prevBtn">Previous</button><button id="nextBtn">Next</button><label>Video <input id="videoVolume" type="range" min="0" max="1" step="0.01" value="1"></label><label>Music <input id="musicVolume" type="range" min="0" max="1" step="0.01" value="0.18"></label><button id="musicBtn">Music: OFF</button></section>
<section class="music-credit"><span id="musicTrack">Music is off.</span> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a> · <a href="https://www.scottbuckley.com.au/library/" target="_blank" rel="noopener">Music by Scott Buckley</a></section>
<section class="timeline-detail"><div class="detail-head"><strong>Detailed timeline</strong><span>One hour at a time</span><input id="timelineHour" type="range" min="0" max="23" step="1" value="0" aria-label="Timeline hour"></div><div id="detailAxis" class="axis"></div><div id="detailTimeline" class="timeline detail-timeline"></div></section>
<section id="timelineSection"><div class="axis"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div><div id="timeline" class="timeline"></div></section>
<section class="chapters"><h2>Chapters</h2><div id="chapters"></div></section>
</main>
<iframe id="scMusic" title="Music engine" aria-hidden="true" tabindex="-1" style="position:absolute;width:1px;height:1px;left:-9999px;border:0;opacity:0" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/scottbuckley/sets/creative-commons-music-library&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false"></iframe>
<script src="https://w.soundcloud.com/player/api.js"></script><script src="app.js"></script>
</body></html>
