name: Migrate wildlife footage

on:
  workflow_dispatch:
    inputs:
      max_files:
        description: 'Maximum new MP4 files to migrate in this run'
        required: true
        default: '10'
        type: string
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: python -m pip install --upgrade requests

      - name: Migrate one-file-at-a-time
        env:
          DRIVE_INDEX_URL: ${{ secrets.DRIVE_INDEX_URL }}
          MAX_FILES: ${{ inputs.max_files || '10' }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/migrate_drive.py
