<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wildlife Safari — Editor</title><link rel="stylesheet" href="styles.css"></head>
<body><header><div><h1>Wildlife Safari Editor</h1><p>Private editor for clip descriptions.</p></div><a href="./">Back to viewer</a></header><main><section class="panel"><h2>Sign in</h2><p id="authStatus">This editor uses GitHub authorization. Only the repository owner should authorize it.</p><button id="loginBtn">Sign in with GitHub</button></section><section class="panel" id="editor" hidden><h2>Clip descriptions</h2><label for="clipSelect">Recording</label><select id="clipSelect"></select><label for="desc">Description</label><textarea id="desc" rows="8" placeholder="Enter the description viewers should see..."></textarea><button id="saveBtn">Save description</button><span id="saveStatus"></span></section></main><script>
const CONFIG={clientId:'Iv23li8zElHSDNmxcFCa',callback:location.origin+location.pathname,backend:'https://script.google.com/macros/s/AKfycbwr9xDOAFFUPCHGn_0ideK37d4FuSNS2MB0c3IS1JeSw6r_sOgdt2ACrSFrPMa-Zn7nxg/exec'};
const repo='fakhtawatch-prog/wildlife-safari-video-player',file='data/clip-descriptions.json';
const $=s=>document.querySelector(s);
function rand(n=32){const a=new Uint8Array(n);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function login(){const state=rand(),verifier=rand(32);sessionStorage.setItem('gh_state',state);sessionStorage.setItem('gh_verifier',verifier);const hex=await sha256(verifier);const bytes=Uint8Array.from(hex.match(/../g).map(h=>parseInt(h,16)));let binary='';bytes.forEach(x=>binary+=String.fromCharCode(x));const codeChallenge=btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');const u=new URL('https://github.com/login/oauth/authorize');u.searchParams.set('client_id',CONFIG.clientId);u.searchParams.set('redirect_uri',CONFIG.callback);u.searchParams.set('state',state);u.searchParams.set('code_challenge',codeChallenge);u.searchParams.set('code_challenge_method','S256');u.searchParams.set('allow_signup','false');location.href=u}
async function exchange(){const p=new URLSearchParams(location.search);if(!p.get('code'))return;const state=p.get('state');if(state!==sessionStorage.getItem('gh_state'))throw new Error('GitHub authorization state mismatch.');const verifier=sessionStorage.getItem('gh_verifier');const r=await fetch(CONFIG.backend,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'oauth_token',code:p.get('code'),redirect_uri:CONFIG.callback,code_verifier:verifier})});if(!r.ok)throw new Error('Authorization exchange failed ('+r.status+').');const j=await r.json();if(!j.access_token)throw new Error(j.error||'Authorization exchange returned no token.');sessionStorage.setItem('gh_token',j.access_token);history.replaceState({},'',location.pathname);}
async function api(path,opts={}){const r=await fetch('https://api.github.com'+path,{...opts,headers:{Accept:'application/vnd.github+json','Authorization':'Bearer '+sessionStorage.getItem('gh_token'),'X-GitHub-Api-Version':'2026-03-10',...(opts.headers||{})}});if(!r.ok)throw new Error((await r.text()).slice(0,300));return r.json()}
async function init(){try{await exchange();if(!sessionStorage.getItem('gh_token'))return;const me=await api('/user');if(me.login!=='fakhtawatch-prog'){throw new Error('This editor is restricted to the repository owner.')}const index=await (await fetch('data/wildlife-index.json')).json();const items=Object.keys(index.days||{}).flatMap(d=>(index.days[d]||[]).map(x=>({...x,day:d})));const sel=$('#clipSelect');sel.innerHTML=items.map((x,i)=>`<option value="${i}">${x.day} — ${x.name}</option>`).join('');const meta=await api('/repos/'+repo+'/contents/'+file);const descriptions=JSON.parse(decodeURIComponent(escape(atob(meta.content.replace(/\n/g,'')))));const load=()=>$('#desc').value=descriptions[items[+sel.value]?.name]||'';sel.onchange=load;load();$('#editor').hidden=false;$('#authStatus').textContent='Signed in as '+me.login+'.';$('#loginBtn').hidden=true;$('#saveBtn').onclick=async()=>{const item=items[+sel.value];descriptions[item.name]=$('#desc').value.trim();const content=JSON.stringify(descriptions,null,2)+'\n';await api('/repos/'+repo+'/contents/'+file,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Update clip description: '+item.name,content:btoa(unescape(encodeURIComponent(content))),sha:meta.sha,branch:'main'})});$('#saveStatus').textContent='Saved.';setTimeout(()=>$('#saveStatus').textContent='',2500)};}catch(e){$('#authStatus').textContent=e.message;console.error(e)}}$('#loginBtn').onclick=login;init();
</script></body></html>
